<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宇科連 3P19 | 日本語プロンプター</title>
<style>
:root{color-scheme:dark;--ink:#f9f8f5;--muted:#acb8d0;--accent:#f3c87f;--bg:#0b1e36;--line:#344967;--size:34px}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Hiragino Sans","BIZ UDPGothic","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{height:75px;padding:10px max(16px,env(safe-area-inset-left)) 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{min-width:0;flex:1}.brand small{display:block;color:var(--accent);font-weight:700;letter-spacing:.06em;font-size:14px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.timer{font-variant-numeric:tabular-nums;font-size:19px;color:var(--accent);font-weight:700}.timer.over{color:#ff6b6b}
.topbtn{background:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:42px;height:42px;font-size:17px}
#reader{height:calc(100dvh - 153px - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}#reader::-webkit-scrollbar{display:none}
article{max-width:800px;margin:auto;padding:24px 22px 48vh}h1{font-size:clamp(20px,4.6vw,30px);line-height:1.35;margin:0 0 26px;color:var(--accent)}
#speech{font-size:var(--size);font-weight:600;line-height:1.6}#speech p{margin:0 0 .9em}
footer{position:fixed;bottom:0;left:0;right:0;min-height:78px;padding:9px max(14px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));display:flex;gap:9px;background:#08172b;border-top:1px solid var(--line)}
footer button{border:0;border-radius:12px;color:var(--ink);background:#29426b;font-size:17px;font-weight:700;min-height:52px}#prev,#next{flex:1}#play{flex:1.3;background:#f38b2c;color:#0b1e36}
.progress{position:fixed;top:75px;left:0;height:3px;background:#f38b2c;transition:width .2s}
@media(max-width:550px){:root{--size:29px}header{height:69px}#reader{height:calc(100dvh - 147px - env(safe-area-inset-bottom))}.progress{top:69px}.topbtn{min-width:38px;height:38px;font-size:15px}}
</style>
</head>
<body>
<header><div class="brand"><small id="counter"></small><span id="target"></span></div><span class="timer" id="timer">00:00</span><button class="topbtn" id="reset" aria-label="タイマーをリセット">↺</button><button class="topbtn" id="speed" aria-label="自動スクロールの速度">1×</button><button class="topbtn" id="smaller" aria-label="文字を小さく">A−</button><button class="topbtn" id="larger" aria-label="文字を大きく">A＋</button></header>
<div class="progress" id="progress"></div>
<main id="reader"><article><h1 id="heading"></h1><div id="speech"></div></article></main>
<footer><button id="prev">◀ 前</button><button id="play">▶ 開始</button><button id="next">次 ▶</button></footer>
<script>
const slides=[{"title":"表紙：宇宙政策における社会的支持形成の制度設計","text":"Space Wave Japanの黒野亜矢子です。今日は、ロケットの打ち上げ場や衛星の工場で聞いた話を、ふだん宇宙の情報を探さない人にも届ける仕組みを提案します。\n\n年末年始に会う家族や友人を、一人思い浮かべてください。その人に「宇宙の仕事をしています」と話したら、何と聞かれるでしょうか。\n（3秒待つ）\nでは、宇宙業界以外の人が、宇宙の仕事をしている人に直接会って、質問できたら。帰ってきて、誰に、どんな話をするでしょうか。","start":0},{"title":"“Space is the province of all humankind”","text":"宇宙条約は、宇宙の探査と利用を「全人類に認められる活動分野」と定めています。では、宇宙の技術を何に使い、誰に届けるかを考えるとき、市民はどこで疑問や経験を伝えられるでしょうか。\n\nたとえば、「大雨のあと、衛星画像で自分の地域の何が分かるのか」。衛星をつくる人に答えを聞くと、「その情報が、いつ、誰に届けば役立つだろう」と、次の問いが生まれます。こうした問いが生まれる場を考える手がかりが、NASA Socialです。","start":37},{"title":"NASA Socialとは？　YouTuber、インフルエンサー、一般の市民がNASAの施設や職員を取材・発信する仕組み","text":"NASA Socialは、NASAが公募で選んだYouTuberや一般の市民を招き、施設や職員を取材して発信してもらう仕組みです。写真は、私たちのメンバーも参加したアルテミスⅡのNASA Socialです。","start":72},{"title":"誰を招くかで、誰に届くかが変わる","text":"NASAは公募で選んだ人を打ち上げ場や施設に招きます。私たちのメンバーが参加した回には、旅行ブログを書く人、彫刻家、中古車販売の仕事をしている人もいました。\n\n同じ場所を見ても、どこに目がいくかは人によって違いますし、ふだん投稿を読んでくれる人も違います。彫刻家のフォロワーはアート好き、中古車販売の人のフォロワーは車好きです。宇宙のニュースを見ない人の画面にも、宇宙の話が流れます。運営に関わる方は、NASAのサイトを自分から見に行かない人にも、宇宙の話を届けたいと話していました。NASA Socialは、NASAや従来の報道とは違う読者に届くことを、応募の条件にしています。既報のアンケートでも、宇宙に詳しくないフォロワーから強い反応や新しい質問があったという声がありました。だから、誰を招くかが大事なんです。\n\n私たちのメンバーも、招待を受けたとき、これまでの発信を見てもらえたと感じました。普段は入れない場所で、働く人に直接聞ける。そう思うと、何を聞いて、日本で読んでくれる人に何を届けようかと考え始めました。","start":90},{"title":"市民は宇宙開発の「観客」にとどまりやすい","text":"では、日本ではどうでしょうか。宇宙開発に携わる人に直接聞ける機会は限られています。機会があっても、「専門家でない自分が語っていいのかな」とためらう人はいます。\n\n一方、スマホで地図を開くだけでも、私たちは宇宙の技術を使っています。技術者には何ができるかが分かります。使う人には、どんな場面で役立つかが分かります。技術の使い方を考えるには、その両方が必要です。","start":169},{"title":"理念はある。「道筋」と「測り方」は？","text":"宇宙基本計画などの政策文書でも、宇宙への関心を人材育成につなげる方向が示されています。そこで私たちが考えたのは、関心を持った人が次に何をするのか、ということです。\n\n見学して「面白かったね」と帰るのも、大切な体験です。そこからもう少し知りたいと思ったとき、何があれば次の一歩を踏み出せるでしょうか。","start":199},{"title":"宇宙への関心を、どう次の行動につなげるか","text":"旅行ブログを書く人が、見学先で「山あいでスマホの地図の現在地がずれるのは、なぜですか」と聞いたとします。教わったことを旅行の記事に書くと、読者から「私もあの温泉街で同じことがありました」と返ってくるかもしれません。別の質問が来て、自分でもう一度調べることもあるでしょう。\n\n誰かに伝えることで、聞いた人にも、伝えた本人にも次の学びが生まれるかもしれません。私たちは、そのきっかけをどうつくり、変化をどう確かめるかを考えました。","start":225},{"title":"研究の問いと方法","text":"日本の政策文書とNASA Socialの資料を読み、実際にNASA Socialにも参加しました。写真は2025年3月、ケネディ宇宙センターのロケット組立棟です。大西卓哉宇宙飛行士が搭乗したCrew-10の打ち上げに合わせて訪ねました。参加者9人と未参加者25人の既報アンケート、私たちの活動記録も参照し、日本で何を試し、何を測るかを整理しました。","start":261},{"title":"Space Wave Japanの実践","text":"私たちも、市民から渡航費の支援を受けてCrew-10を取材し、現地で聞いた話を日本の読者に届けました。ただ、取材の機会は不定期で、活動はボランティアに頼っています。誰に届き、その人が何をしたかまで確かめる仕組みもありません。この経験から、施設を訪ねる機会と、伝えた後を確かめる方法の両方が必要だと考えました。","start":291},{"title":"市民と宇宙をつなぐ3つの仕組みを比べる","text":"NASA Socialの施設に入れること、JAXAの正確な情報、市民がふだんの読者に届けられること。この三つの強みを組み合わせたのが、Japan Space Socialです。","start":318},{"title":"施設公開で聞いた話を、来場しない人にも","text":"JAXAや企業の施設公開では、すでに来場者が実物を見て、専門家に直接質問できます。その機会を生かし、会場に来なかった人にも、仕事や暮らしとの接点から伝えてもらうのが今回の提案です。\n\n受け入れ側にも、どんな人に話が届き、どの説明で関心を持ったか、どんな質問が返ってきたかを共有します。","start":333},{"title":"提案：Japan Space Social（小規模実証）","text":"提案は、2027年度に12か月、合わせて30人程度、3件の小規模な実証です。宇宙を専門としない分野で発信する高校生以上の方も対象です。協力いただく組織ごとに、既存の公開や見学の機会を一つ選び、公開できる工程や話題から始めることを想定しています。","start":357},{"title":"進め方：2つのグループで比べる","text":"参加者を、現地で見学し専門家と話して発信するグループと、先にオンラインで説明を聞くグループに分けます。参加前、直後、3か月後、6か月後に同じ質問をして、変化を比べます。比較グループにも後日、現地を訪ねる機会を設けます。小規模な実証なので、まず変化の傾向と運営上の課題を見ます。","start":378},{"title":"制度設計：信頼と継続を支える仕組み（1/4）","text":"受け入れ側には、公開できる範囲を決めていただき、施設を案内し、質問に答えていただく想定です。募集や連絡、アンケートは事務局が担い、結果は評価担当がまとめます。参加者は疑問に思ったことも発信できます。好意的な投稿は参加の条件にしません。\n\n新しい説明資料を一からつくっていただく前提ではありません。","start":402},{"title":"制度設計：信頼と継続を支える仕組み（2/4）","text":"次に、誰を招くかです。宇宙が専門でない人も公募し、選ばれた人を市民コミュニケーターとして正式に招待します。招待を受けて「自分の分野から質問していいんだ」と思えることも、大事にしたいところです。","start":427},{"title":"制度設計：信頼と継続を支える仕組み（3/4）","text":"見学の当日は、専門家に質問できる時間を取り、発信に使える用語集や事実確認の窓口を用意します。JAXAや受け入れ企業が公式SNSで参加者の投稿を紹介することも考えています。","start":443},{"title":"制度設計：信頼と継続を支える仕組み（4/4）","text":"撮影できる場所、公開できる情報、当日の安全ルールは受け入れ側と事前に確認します。たとえば、公開可能な展示や工程だけを案内する形でも実施できます。誤りがあった場合の訂正手順を共有し、発信後の変化を6か月後まで追います。","start":458},{"title":"発信の量ではなく、人の変化を測る","text":"評価では、ふだん宇宙の情報を見ない人に届いたか、何を知り、次に何をしたかを、受け手にも聞きます。関連する仕事を調べた、家族に話した、見学に行った。そうした行動を見ます。\n\n受け入れ側には、準備と当日にかかった人手や費用を聞きます。読者から返ってきた質問と評価結果を協力先に共有し、次も続けられるか、何を見直すかを一緒に考えます。","start":477},{"title":"実証と評価","text":"この結果をもとに、続ける価値があるかを判断します。市民を無償の広告塔にしないことが前提です。受けた支援は明らかにし、何をどう伝えるかは本人が決めます。関心を持った人には、既存の学びや人材育成の機会につなぐことも考えられます。","start":505},{"title":"公開できる施設や工程","text":"衛星企業、ロケット企業、JAXAの皆さま。すでに行っている見学会や施設公開で、「この工程なら見せられる」「この話を別の分野の人にも届けたい」と思うものがあれば、発表後にぜひお声がけください。何を公開できるか、誰に来てもらうか、その一回から一緒に考えたいです。","start":524},{"title":"宇宙を、自分の言葉で語れる社会へ。","text":"冒頭で思い浮かべていただいた家族や友人に戻ります。見学先で聞いた衛星画像の話を写真と一緒に送ったら、その人は自宅の周りのハザードマップを開くかもしれません。「次に大雨が降ったとき、この情報は誰が届けるの？」と聞くかもしれません。\n\n誰に、どんな形で技術を届けるか。その選択を考えるとき、使う人の経験にも耳を傾けたい。これが、私たちの宇宙倫理の問いです。まずは実証で、誰に届き、どんな行動や問いが生まれるかを確かめます。その先には、市民が日本の宇宙開発の方針を考える議論に関われる機会をつくりたいと考えています。\n\n（一拍）\n皆さんの職場なら、誰を招き、何を聞いてもらいたいですか。画面右のアンケート用QRコードから、ご意見をお寄せください。ご清聴ありがとうございました。","start":546}];
const LIMIT=600; // 発表時間10分
const $=id=>document.getElementById(id);
let index=0,playing=false,startedAt=0,elapsed=0,lastFrame=0,font=Number(localStorage.getItem('ukarenFont')||0),speedIndex=1;
const speeds=[.75,1,1.25,1.5];
const reader=$('reader');
const fmt=sec=>`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function paras(s){return s.split(/(?<=。)/u).filter(v=>v.trim()).map(v=>'<p>'+esc(v.trim())+'</p>').join('')}
function show(n){index=Math.max(0,Math.min(slides.length-1,n));const s=slides[index];$('counter').textContent=`スライド ${index+1} / ${slides.length}`;$('target').textContent=`目安：${fmt(s.start)} 開始`;$('heading').textContent=s.title;$('speech').innerHTML=paras(s.text);reader.scrollTop=0;$('progress').style.width=`${(index+1)/slides.length*100}%`;$('prev').disabled=index===0;$('next').disabled=index===slides.length-1}
function setFont(){document.documentElement.style.setProperty('--size',`${Math.max(20,Math.min(56,(innerWidth<550?29:34)+font))}px`);localStorage.setItem('ukarenFont',font)}
function now(){return Math.floor(elapsed+(playing?(performance.now()-startedAt)/1000:0))}
function renderTimer(){const sec=now();$('timer').textContent=fmt(sec);$('timer').classList.toggle('over',sec>=LIMIT)}
function tick(t){if(playing){if(lastFrame){reader.scrollTop+=Math.max(0,t-lastFrame)*.02*speeds[speedIndex]}lastFrame=t;renderTimer()}requestAnimationFrame(tick)}
function playPause(){if(playing){elapsed+=(performance.now()-startedAt)/1000;playing=false;lastFrame=0;$('play').textContent='▶ 再開'}else{startedAt=performance.now();playing=true;lastFrame=0;$('play').textContent='Ⅱ 一時停止'}renderTimer()}
$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('play').onclick=playPause;
$('reset').onclick=()=>{if(confirm('タイマーを0に戻しますか？')){elapsed=0;startedAt=performance.now();renderTimer()}};
$('speed').onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;$('speed').textContent=`${speeds[speedIndex]}×`};
$('smaller').onclick=()=>{font-=3;setFont()};$('larger').onclick=()=>{font+=3;setFont()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1);if(e.key===' '){e.preventDefault();playPause()}});
setFont();show(0);renderTimer();requestAnimationFrame(tick);
</script>
</body></html>
